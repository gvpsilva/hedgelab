name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários com cobertura
        run: npm run test:coverage

      - name: Instalar Chromium e dependências do sistema no Linux
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Instalar Chromium no macOS e Windows
        if: runner.os != 'Linux'
        run: npx playwright install chromium

      - name: Testes end-to-end
        id: e2e
        run: npm run test:e2e

      # Guardado para ser anexado à release
      - name: Publicar relatório de cobertura
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/

      - name: Publicar relatório do Playwright (em caso de falha nos e2e)
        if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.os }}
          path: playwright-report/

  deploy:
    name: Deploy em produção (Vercel)
    needs: testes # Só publica se os testes passarem nos três sistemas
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.publicar.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    outputs:
      url: ${{ steps.publicar.outputs.url }}

    steps:
      - name: Conferir os segredos da Vercel
        run: |
          faltando=""
          [ -z "$VERCEL_TOKEN" ] && faltando="$faltando VERCEL_TOKEN"
          [ -z "$VERCEL_ORG_ID" ] && faltando="$faltando VERCEL_ORG_ID"
          [ -z "$VERCEL_PROJECT_ID" ] && faltando="$faltando VERCEL_PROJECT_ID"
          if [ -n "$faltando" ]; then
            echo "::error::Segredos não cadastrados:$faltando"
            exit 1
          fi
          case "$VERCEL_ORG_ID" in team_*) ;; *) echo "::warning::VERCEL_ORG_ID costuma começar com team_. Confira o valor de orgId em .vercel/project.json." ;; esac
          case "$VERCEL_PROJECT_ID" in prj_*) ;; *) echo "::warning::VERCEL_PROJECT_ID costuma começar com prj_. Confira o valor de projectId em .vercel/project.json." ;; esac

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar a Vercel CLI
        run: npm install --global vercel@latest

      - name: Verificar acesso à Vercel
        run: |
          vercel whoami --token="$VERCEL_TOKEN"
          vercel project ls --token="$VERCEL_TOKEN"

      - name: Baixar as configurações do projeto na Vercel
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Preparar os arquivos de produção
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Publicar na Vercel
        id: publicar
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado em produção: $url" >> "$GITHUB_STEP_SUMMARY"


  release:
    name: Gerar release
    needs: deploy 
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Definir a versão
        id: versao
        run: |
          base=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")
          echo "tag=v${base}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Baixar o relatório de cobertura
        uses: actions/download-artifact@v4
        with:
          name: cobertura
          path: coverage

      - name: Empacotar o site e a cobertura
        env:
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          zip -qr "hedgelab-site-$TAG.zip" public
          zip -qr "hedgelab-cobertura-$TAG.zip" coverage

      - name: Criar a release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
          URL_PRODUCAO: ${{ needs.deploy.outputs.url }}
        run: |
          gh release create "$TAG" \
            "hedgelab-site-$TAG.zip" \
            "hedgelab-cobertura-$TAG.zip" \
            --target "$GITHUB_SHA" \
            --title "HedgeLab $TAG" \
            --notes "Versão publicada em produção: $URL_PRODUCAO" \
            --generate-notes
